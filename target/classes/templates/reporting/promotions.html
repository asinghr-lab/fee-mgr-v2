<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">

<body>
	<section layout:fragment="content">
		<h1 class="page-title h3">Grade Progression</h1>
		<div class="table-responsive card">
			<table class="table">
				<thead>
					<tr>
						<th>Student</th>
						<th>Admission No.</th>
						<th>Previous Grade</th>
						<th>Current Grade</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="r:${rows.content}">
						<td th:text="${r.studentName}"></td>
						<td th:text="${r.admissionNumber}"></td>
						<td th:text="${r.fromGrade}"></td>
						<td th:text="${r.toGrade}"></td>
					</tr>
				</tbody>
			</table>
		</div>
	</section>
</body>

</html>
