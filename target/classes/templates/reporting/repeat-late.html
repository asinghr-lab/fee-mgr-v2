<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">

<body>
	<section layout:fragment="content">
		<h1 class="page-title h3">Repeat Late-Payment Students</h1>
		<form class="row g-2 mb-3">
			<div class="col-auto"><label class="form-label">Late Payments ≥</label><input class="form-control"
					type="number" min="1" name="minimum" th:value="${minimum}"></div>
			<div class="col-auto align-self-end"><button class="btn btn-primary">Apply</button></div>
		</form>
		<div class="table-responsive card">
			<table class="table table-hover mb-0">
				<thead>
					<tr>
						<th>Student</th>
						<th>Admission No.</th>
						<th>Grade</th>
						<th>Late Payments</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="r:${rows.content}">
						<td><a th:href="@{/reporting/students/{id}(id=${r.enrollmentId})}"
								th:text="${r.studentName}"></a></td>
						<td th:text="${r.admissionNumber}"></td>
						<td th:text="${r.gradeName}"></td>
						<td th:text="${r.latePayments}"></td>
					</tr>
				</tbody>
			</table>
		</div>
	</section>
</body>

</html>
