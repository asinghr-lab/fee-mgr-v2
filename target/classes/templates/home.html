<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/base}">

<head>
    <title>Dashboard</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <div class="text-uppercase small text-primary fw-bold">Admin workspace</div>
                <h1 class="page-title h3 mb-1">Dashboard</h1>
                <p class="text-muted mb-0">Welcome back, <strong th:text="${username}">user</strong>.</p>
            </div>
        </div>
        <div class="row g-3">
            <div class="col-md-6 col-xl-4">
                <div class="card stat-card h-100">
                    <div class="d-flex gap-3 align-items-center">
                        <div class="stat-icon"><i class="bi bi-building"></i></div>
                        <div>
                            <div class="text-muted small">School</div>
                            <div class="fw-semibold">School administration</div>
                        </div>
                    </div><a class="stretched-link mt-3 d-inline-block" th:href="@{/school}">Open school management <i
                            class="bi bi-arrow-right"></i></a>
                </div>
            </div>
            <div class="col-md-6 col-xl-4">
                <div class="card stat-card h-100">
                    <div class="d-flex gap-3 align-items-center">
                        <div class="stat-icon"><i class="bi bi-people"></i></div>
                        <div>
                            <div class="text-muted small">Students</div>
                            <div class="fw-semibold">Student directory</div>
                        </div>
                    </div><a class="stretched-link mt-3 d-inline-block" th:href="@{/school/students}">Open students <i
                            class="bi bi-arrow-right"></i></a>
                </div>
            </div>
            <div class="col-md-6 col-xl-4" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                <div class="card stat-card h-100">
                    <div class="d-flex gap-3 align-items-center">
                        <div class="stat-icon"><i class="bi bi-check2-square"></i></div>
                        <div>
                            <div class="text-muted small">Approval</div>
                            <div class="fw-semibold">Enrollment requests</div>
                        </div>
                    </div><a class="stretched-link mt-3 d-inline-block" th:href="@{/school/enrollments/requests}">Review
                        requests <i class="bi bi-arrow-right"></i></a>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
