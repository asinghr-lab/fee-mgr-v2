<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container"><div class="row justify-content-center mt-5"><div class="col-md-4">
<div class="card shadow-sm"><div class="card-body"><h4 class="mb-4 text-center">School Fee Management</h4>
<div class="alert alert-danger" th:if="${param.error}">Invalid username or password.</div>
<div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>
<form th:action="@{/login}" method="post">
<div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" required autofocus></div>
<div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" required></div>
<button class="btn btn-primary w-100" type="submit">Login</button></form>
<hr><small class="text-muted">Test users: admin/admin123 and staff/staff123</small>
</div></div></div></div></div></body></html>
