<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/base}">

<head>
	<title>Fee Structures</title>
</head>

<body>
	<main layout:fragment="content">
		<div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3">
			<div>
				<div class="text-uppercase small fw-bold text-primary">Billing / Fee Configuration</div>
				<h1 class="page-title h3 mb-1">Fee Structures</h1>
				<p class="text-secondary mb-0">Immutable collections of active fee components, frequency and amount.</p>
			</div><a class="btn btn-primary" th:href="@{/billing/fee-structures/new}"><i
					class="bi bi-plus-lg me-1"></i>New Structure</a>
		</div>
		<div th:if="${message}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span
				th:text="${message}"></span></div>
		<div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i><span
				th:text="${error}"></span></div>
		<div class="row g-3">
			<div class="col-12 col-xl-6" th:each="s:${structures}">
				<div class="card h-100">
					<div class="card-header d-flex justify-content-between align-items-center">
						<div>
							<h5 class="mb-1" th:text="${s.name}"></h5><span class="badge"
								th:classappend="${s.status.name()=='ACTIVE'}?' text-bg-success':' text-bg-secondary'"
								th:text="${s.status}"></span>
						</div>
						<form th:if="${s.status.name()=='ACTIVE'}"
							th:action="@{/billing/fee-structures/{id}/deactivate(id=${s.id})}" method="post"
							sec:authorize="hasRole('ADMIN')"><button class="btn btn-sm btn-outline-danger"
								onclick="return confirm('Mark this structure INACTIVE? Existing grade assignments will remain.')"><i
									class="bi bi-pause-circle me-1"></i>Deactivate</button></form>
					</div>
					<div class="card-body p-0">
						<div class="table-responsive">
							<table class="table table-sm mb-0">
								<thead>
									<tr>
										<th>Component</th>
										<th>Frequency</th>
										<th class="text-end">Amount</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="i:${s.items}">
										<td th:text="${i.feeComponent.name}"></td>
										<td><span class="badge text-bg-light" th:text="${i.frequency}"></span></td>
										<td class="text-end" th:text="${#numbers.formatDecimal(i.amount,1,2)}"></td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
			<div class="col-12" th:if="${#lists.isEmpty(structures)}">
				<div class="card">
					<div class="card-body text-center text-secondary py-5">No fee structures defined.</div>
				</div>
			</div>
		</div>
	</main>
</body>

</html>
