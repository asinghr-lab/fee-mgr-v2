<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base}"><head><title>Invoice Details</title></head><body><section layout:fragment="content"><div class="page-header d-flex justify-content-between align-items-center gap-3"><div><div class="text-uppercase small text-primary fw-bold">Billing / Invoice</div><h1 class="page-title h3" th:text="${invoice.invoiceNumber}">INV</h1><p class="text-muted mb-0"><span th:text="${invoice.studentEnrollment.student.fullName}"></span> · <span th:text="${invoice.studentEnrollment.student.admissionNumber}"></span></p></div><a class="btn btn-outline-secondary" th:href="@{/billing/invoices}"><i class="bi bi-arrow-left me-1"></i>Back</a></div><div th:if="${message}" class="alert alert-success"><span th:text="${message}"></span></div><div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div><div class="row g-4"><div class="col-xl-8"><div class="card"><div class="card-header d-flex justify-content-between"><span>Invoice Details</span><span class="badge" th:classappend="${invoice.status.name()=='ISSUED'?'text-bg-success':'text-bg-secondary'}" th:text="${invoice.status}"></span></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Fee Component</th><th>Frequency</th><th class="text-end">Original</th><th class="text-end">Discount</th><th class="text-end">Net</th></tr></thead><tbody><tr th:each="i:${invoice.items}"><td th:text="${i.feeComponentName}"></td><td th:text="${i.frequency}"></td><td class="text-end" th:text="${i.originalAmount}"></td><td class="text-end" th:text="${i.discountAmount}"></td><td class="text-end fw-semibold" th:text="${i.netAmount}"></td></tr></tbody><tfoot><tr><th colspan="2">Total</th><th class="text-end" th:text="${invoice.originalAmount}"></th><th class="text-end" th:text="${invoice.discountAmount}"></th><th class="text-end" th:text="${invoice.netAmount}"></th></tr></tfoot></table></div></div></div><div class="col-xl-4"><div class="card mb-4"><div class="card-header"><i class="bi bi-percent me-2"></i>Request Discount</div><div class="card-body"><form th:action="@{'/billing/invoices/' + ${invoice.id} + '/discount-requests'}" method="post"><div class="mb-3"><label class="form-label">Fee Component</label><select class="form-select" name="invoiceItemId" required><option value="">Select</option><option th:each="i:${invoice.items}" th:value="${i.id}" th:text="${i.feeComponentName + ' — Net ' + i.netAmount}"></option></select></div><div class="mb-3"><label class="form-label">Requested Discount</label><input class="form-control" type="number" name="requestedAmount" min="0.01" step="0.01" required></div><div class="mb-3"><label class="form-label">Reason</label><textarea class="form-control" name="reason" rows="3" maxlength="500" required></textarea></div><button class="btn btn-primary w-100"><i class="bi bi-send me-1"></i>Submit Request</button></form></div></div><div class="card"><div class="card-header text-danger"><i class="bi bi-x-circle me-2"></i>Request Cancellation</div><div class="card-body"><form th:action="@{'/billing/invoices/' + ${invoice.id} + '/cancellation-requests'}" method="post"><div class="mb-3"><label class="form-label">Reason</label><textarea class="form-control" name="reason" rows="3" maxlength="500" required></textarea></div><button class="btn btn-outline-danger w-100"><i class="bi bi-send me-1"></i>Submit Cancellation Request</button></form></div></div></div></div><div class="mt-3"><a class="btn btn-success" th:if="${invoice.status.name() == 'ISSUED'}" th:href="@{/collection/invoices/{id}/pay(id=${invoice.id})}"><i class="bi bi-cash-stack me-1"></i>Record Payment</a></div></section></body></html>
