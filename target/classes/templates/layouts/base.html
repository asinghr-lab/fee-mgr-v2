<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE — $LAYOUT_TITLE">School Fee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
    <nav class="navbar navbar-dark app-navbar sticky-top">
        <div class="container-fluid px-3 px-lg-4"><button class="btn btn-outline-light d-lg-none me-2" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#sidebar"><i class="bi bi-list fs-5"></i></button><a
                class="navbar-brand fw-semibold" th:href="@{/}"><i class="bi bi-mortarboard-fill me-2"></i>School Fee
                Management</a>
            <div class="ms-auto d-flex align-items-center gap-2"><span class="text-white-50 small d-none d-md-inline"><i
                        class="bi bi-person-circle me-1"></i><span th:text="${#authentication.name}">user</span></span>
                <form th:action="@{/logout}" method="post" class="m-0"><button
                        class="btn btn-sm btn-light text-primary fw-semibold"><i
                            class="bi bi-box-arrow-right me-1"></i>Logout</button></form>
            </div>
        </div>
    </nav>
    <div class="d-flex">
        <aside id="sidebar" class="app-sidebar offcanvas-lg offcanvas-start" tabindex="-1">
            <div class="offcanvas-header d-lg-none border-bottom">
                <h5 class="mb-0"><i class="bi bi-mortarboard-fill me-2"></i>Navigation</h5><button type="button"
                    class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body p-0">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>
        </aside>
        <main class="flex-grow-1 app-content" layout:fragment="content"></main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <div layout:fragment="scripts"></div>
</body>

</html>
