<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">

<head>
	<title>Add Student</title>
</head>

<body>
	<section layout:fragment="content">
		<div class="row justify-content-center">
			<div class="col-xl-9">
				<div class="page-header">
					<div class="text-uppercase small text-primary fw-bold">School module</div>
					<h1 class="page-title h3">Add Student</h1>
					<p class="text-muted mb-0">The admission date will automatically be today's date.</p>
				</div>
				<div class="card">
					<div class="card-body p-4">
						<form th:action="@{/school/students}" th:object="${request}" method="post">
							<div class="row g-3">
								<div class="col-md-6"><label class="form-label fw-semibold">Admission
										Number</label><input class="form-control" th:field="*{admissionNumber}"
										required>
									<div class="text-danger small" th:errors="*{admissionNumber}"></div>
								</div>
								<div class="col-md-6"><label class="form-label fw-semibold">First Name</label><input
										class="form-control" th:field="*{firstName}" required>
									<div class="text-danger small" th:errors="*{firstName}"></div>
								</div>
								<div class="col-md-6"><label class="form-label fw-semibold">Last Name</label><input
										class="form-control" th:field="*{lastName}"></div>
								<div class="col-md-6"><label class="form-label fw-semibold">Date of Birth</label><input
										type="date" class="form-control" th:field="*{dateOfBirth}"></div>
								<div class="col-md-4"><label class="form-label fw-semibold">Gender</label><select
										class="form-select" th:field="*{gender}">
										<option value="">Select</option>
										<option value="MALE">Male</option>
										<option value="FEMALE">Female</option>
										<option value="OTHER">Other</option>
									</select></div>
								<div class="col-md-4"><label class="form-label fw-semibold">Phone</label><input
										class="form-control" th:field="*{phoneNumber}"></div>
								<div class="col-md-4"><label class="form-label fw-semibold">Email</label><input
										type="email" class="form-control" th:field="*{email}">
									<div class="text-danger small" th:errors="*{email}"></div>
								</div>
							</div>
							<div class="alert alert-info mt-4"><i class="bi bi-info-circle me-2"></i>After saving,
								request enrollment into a grade and academic year.</div>
							<div class="d-flex gap-2"><button class="btn btn-primary"><i
										class="bi bi-person-plus me-1"></i>Add Student</button><a
									class="btn btn-outline-secondary" th:href="@{/school/students}">Cancel</a></div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
