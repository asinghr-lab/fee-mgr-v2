<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">

<head>
	<title>Enrollments</title>
</head>

<body>
	<section layout:fragment="content">
		<div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3">
			<div>
				<div class="text-uppercase small text-primary fw-bold">School module</div>
				<h1 class="page-title h3">Enrollments</h1>
				<p class="text-muted mb-0">All student enrollment records and their current status.</p>
			</div>
			<a class="btn btn-outline-secondary" th:href="@{/school/students}"><i
					class="bi bi-people me-1"></i>Students</a>
		</div>
		<div class="card">
			<div class="card-header p-3">
				<h2 class="h6 mb-0"><i class="bi bi-journal-check me-2 text-primary"></i>Enrollment Directory</h2>
			</div>
			<div class="table-responsive">
				<table class="table table-hover mb-0 align-middle">
					<thead>
						<tr>
							<th>Student</th>
							<th>Admission #</th>
							<th>Academic Year</th>
							<th>Grade</th>
							<th>Status</th>
							<th>Requested By</th>
							<th>Request Date</th>
							<th>Approved By</th>
							<th>Approval Date</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="r : ${enrollmentPage.content}">
							<td class="fw-semibold" th:text="${r.student.fullName}"></td>
							<td th:text="${r.student.admissionNumber}"></td>
							<td th:text="${r.academicYear.name}"></td>
							<td th:text="${r.grade.name}"></td>
							<td><span class="badge rounded-pill"
									th:classappend="${r.status.name() == 'REQUESTED' ? 'text-bg-warning' : (r.status.name() == 'APPROVED' ? 'text-bg-success' : 'text-bg-secondary')}"
									th:text="${r.status}"></span></td>
							<td th:text="${r.requestedBy.username}"></td>
							<td th:text="${r.requestDate}"></td>
							<td th:text="${r.approvedBy == null ? '—' : r.approvedBy.username}"></td>
							<td th:text="${r.approvalDate == null ? '—' : r.approvalDate}"></td>
						</tr>
						<tr th:if="${enrollmentPage.empty}">
							<td colspan="9" class="text-center py-5 text-muted"><i
									class="bi bi-inbox fs-2 d-block mb-2"></i>No enrollment records found.</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2"
				th:if="${enrollmentPage.totalPages > 0}">
				<div class="small text-muted">Showing page <span th:text="${enrollmentPage.number + 1}"></span> of <span
						th:text="${enrollmentPage.totalPages}"></span> (<span
						th:text="${enrollmentPage.totalElements}"></span> records)</div>
				<nav aria-label="Enrollment pagination">
					<ul class="pagination pagination-sm mb-0">
						<li class="page-item" th:classappend="${enrollmentPage.first ? 'disabled' : ''}"><a
								class="page-link"
								th:href="@{/school/enrollments(page=${enrollmentPage.number - 1},size=${enrollmentPage.size})}">Previous</a>
						</li>
						<li class="page-item" th:each="p : ${#numbers.sequence(0, enrollmentPage.totalPages - 1)}"
							th:classappend="${p == enrollmentPage.number ? 'active' : ''}"><a class="page-link"
								th:href="@{/school/enrollments(page=${p},size=${enrollmentPage.size})}"
								th:text="${p + 1}"></a></li>
						<li class="page-item" th:classappend="${enrollmentPage.last ? 'disabled' : ''}"><a
								class="page-link"
								th:href="@{/school/enrollments(page=${enrollmentPage.number + 1},size=${enrollmentPage.size})}">Next</a>
						</li>
					</ul>
				</nav>
			</div>
		</div>
	</section>
</body>

</html>
