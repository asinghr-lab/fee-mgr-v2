<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">

<head>
	<title>New Academic Year</title>
</head>

<body>
	<section layout:fragment="content">
		<div class="row justify-content-center">
			<div class="col-xl-8">
				<div class="page-header">
					<div class="text-uppercase small text-primary fw-bold">School module</div>
					<h1 class="page-title h3">New Academic Year</h1>
					<p class="text-muted mb-0">Define the academic and reporting period.</p>
				</div>
				<div class="card">
					<div class="card-body p-4">
						<form th:action="@{/school/academic-years}" th:object="${request}" method="post">
							<div class="mb-3"><label class="form-label fw-semibold">Academic Year</label><input
									class="form-control" th:field="*{name}" placeholder="2026-2027" required>
								<div class="text-danger small" th:errors="*{name}"></div>
							</div>
							<div class="row g-3">
								<div class="col-md-6"><label class="form-label fw-semibold">Start Date</label><input
										type="date" class="form-control" th:field="*{startDate}" required>
									<div class="text-danger small" th:errors="*{startDate}"></div>
								</div>
								<div class="col-md-6"><label class="form-label fw-semibold">End Date</label><input
										type="date" class="form-control" th:field="*{endDate}" required>
									<div class="text-danger small" th:errors="*{endDate}"></div>
								</div>
							</div>
							<div class="d-flex gap-2 mt-4"><button class="btn btn-primary"><i
										class="bi bi-calendar-plus me-1"></i>Create Academic Year</button><a
									class="btn btn-outline-secondary" th:href="@{/school}">Cancel</a></div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
