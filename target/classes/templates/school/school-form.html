<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/base}">

<head>
    <title th:text="${pageTitle}">School Details</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-xl-8">
                <div class="page-header">
                    <div class="text-uppercase small text-primary fw-bold">School module</div>
                    <h1 class="page-title h3 mb-1" th:text="${pageTitle}"></h1>
                    <p class="text-muted mb-0">Only administrators can maintain school details.</p>
                </div>
                <div class="card">
                    <div class="card-body p-4">
                        <form th:action="@{/school/edit}" th:object="${schoolRequest}" method="post">
                            <div class="mb-3"><label class="form-label fw-semibold">School Name</label><input
                                    class="form-control" th:field="*{name}" required>
                                <div class="text-danger small" th:errors="*{name}"></div>
                            </div>
                            <div class="mb-3"><label class="form-label fw-semibold">Address</label><textarea
                                    class="form-control" rows="3" th:field="*{address}"></textarea></div>
                            <div class="row g-3">
                                <div class="col-md-6"><label class="form-label fw-semibold">Phone</label><input
                                        class="form-control" th:field="*{phoneNumber}"></div>
                                <div class="col-md-6"><label class="form-label fw-semibold">Email</label><input
                                        type="email" class="form-control" th:field="*{email}">
                                    <div class="text-danger small" th:errors="*{email}"></div>
                                </div>
                            </div>
                            <div class="d-flex gap-2 mt-4"><button class="btn btn-primary"><i
                                        class="bi bi-check2 me-1"></i>Save School</button><a
                                    class="btn btn-outline-secondary" th:href="@{/school}">Cancel</a></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
