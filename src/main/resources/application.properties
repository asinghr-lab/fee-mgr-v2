

spring.application.name=school-fee-management

server.port=8080

# ============================================================
# H2
# ============================================================

spring.datasource.url=jdbc:h2:file:./data/school-fee-management;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# ============================================================
# JPA
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Thymeleaf
# ============================================================

spring.thymeleaf.cache=false

# ============================================================
# Error handling
# ============================================================

#server.error.include-message=never
#server.error.include-stacktrace=never

# ============================================================
# Logging
# ============================================================

logging.level.com.discover.schoolfee=INFO
# ============================================================
# School display configuration
# ============================================================
school.name=Discover School

