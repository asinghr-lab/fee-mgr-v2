<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">

<head>
	<title>My Profile</title>
</head>

<body>
	<section layout:fragment="content">
		<div class="page-header">
			<div class="text-uppercase small text-primary fw-bold">Account</div>
			<h1 class="page-title h3 mb-1">My Profile</h1>
			<p class="text-muted mb-0">Update your profile information.</p>
		</div>
		<div th:if="${message}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span
				th:text="${message}"></span></div>
		<div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i><span
				th:text="${error}"></span></div>
		<div class="card">
			<div class="card-body p-4">
				<form th:action="@{/profile}" th:object="${profileRequest}" method="post">
					<div class="row g-3">
						<div class="col-md-6"><label class="form-label">Username</label><input class="form-control"
								th:value="${profileUser.username}" readonly></div>
						<div class="col-md-6"><label class="form-label">Roles</label><input class="form-control"
								th:value="${#strings.listJoin(profileRoles, ', ')}" readonly></div>
						<div class="col-12"><label class="form-label">Display name</label><input class="form-control"
								th:field="*{displayName}" maxlength="150">
							<div class="text-danger small mt-1" th:errors="*{displayName}"></div>
						</div>
					</div>
					<div class="mt-4 d-flex gap-2"><button class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Save
							Changes</button><a class="btn btn-outline-secondary" th:href="@{/}">Cancel</a></div>
				</form>
			</div>
		</div>
	</section>
</body>

</html>
