<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">

<head>
	<title>Add User</title>
</head>

<body>
	<section layout:fragment="content">
		<div class="page-header">
			<div class="text-uppercase small text-primary fw-bold">Administration</div>
			<h1 class="page-title h3 mb-1">Add New User</h1>
			<p class="text-muted mb-0">Create an application account for an Admin or Staff user.</p>
		</div>
		<div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i><span
				th:text="${error}"></span></div>
		<div class="card">
			<div class="card-body p-4">
				<form th:action="@{/admin/users}" th:object="${request}" method="post" class="row g-3">
					<div class="col-md-6"><label class="form-label">Username</label><input class="form-control"
							th:field="*{username}" maxlength="100" autocomplete="username">
						<div class="text-danger small" th:errors="*{username}"></div>
					</div>
					<div class="col-md-6"><label class="form-label">Display name</label><input class="form-control"
							th:field="*{displayName}" maxlength="150">
						<div class="text-danger small" th:errors="*{displayName}"></div>
					</div>
					<div class="col-md-6"><label class="form-label">Role</label><select class="form-select"
							th:field="*{role}">
							<option th:each="role : ${roles}" th:value="${role}" th:text="${role}">STAFF</option>
						</select>
						<div class="text-danger small" th:errors="*{role}"></div>
					</div>
					<div class="col-md-6"></div>
					<div class="col-md-6"><label class="form-label">Password</label><input type="password"
							class="form-control" th:field="*{password}" minlength="8" autocomplete="new-password">
						<div class="text-danger small" th:errors="*{password}"></div>
					</div>
					<div class="col-md-6"><label class="form-label">Confirm password</label><input type="password"
							class="form-control" th:field="*{confirmPassword}" minlength="8"
							autocomplete="new-password">
						<div class="text-danger small" th:errors="*{confirmPassword}"></div>
					</div>
					<div class="col-12 mt-3"><button class="btn btn-primary"><i
								class="bi bi-person-plus-fill me-1"></i>Create User</button><a
							class="btn btn-outline-secondary ms-2" th:href="@{/admin/users}">Cancel</a></div>
				</form>
			</div>
		</div>
	</section>
</body>

</html>
