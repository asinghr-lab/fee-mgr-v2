<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">

<head>
	<title>Staff Dashboard</title>
</head>

<body>
	<section layout:fragment="content">
		<div class="page-header">
			<div class="text-uppercase small text-primary fw-bold">Staff workspace</div>
			<h1 class="page-title h3 mb-1">Staff Dashboard</h1>
			<p class="text-muted mb-0">Welcome back, <strong th:text="${username}">staff</strong>.</p>
		</div>
		<div class="row g-3">
			<div class="col-md-6 col-xl-4">
				<div class="card dashboard-card h-100">
					<div class="stat-icon"><i class="bi bi-people-fill"></i></div>
					<h5 class="mt-3">Students</h5>
					<p class="text-muted">Add students and submit grade enrollment requests.</p><a
						class="btn btn-primary" th:href="@{/school/students}">Open Students <i
							class="bi bi-arrow-right ms-1"></i></a>
				</div>
			</div>
			<div class="col-md-6 col-xl-4">
				<div class="card dashboard-card h-100">
					<div class="stat-icon"><i class="bi bi-person-circle"></i></div>
					<h5 class="mt-3">My Profile</h5>
					<p class="text-muted">Review and update your profile information.</p><a
						class="btn btn-outline-primary" th:href="@{/profile}">Open Profile</a>
				</div>
			</div>
			<div class="col-md-6 col-xl-4">
				<div class="card dashboard-card h-100">
					<div class="stat-icon"><i class="bi bi-key-fill"></i></div>
					<h5 class="mt-3">Reset Password</h5>
					<p class="text-muted">Change your password after confirming your current password.</p><a
						class="btn btn-outline-primary" th:href="@{/reset-password}">Reset Password</a>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
