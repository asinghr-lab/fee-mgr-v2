<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — School Fee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body style="background:linear-gradient(135deg,#eef3ff,#f8fafc);min-height:100vh">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-6 col-lg-4">
                <div class="text-center mb-4">
                    <div class="stat-icon mx-auto mb-3"><i class="bi bi-mortarboard-fill"></i></div>
                    <h1 class="h4 fw-bold text-primary">School Fee Management</h1>
                    <p class="text-muted">Sign in to continue</p>
                </div>
                <div class="card">
                    <div class="card-body p-4">
                        <div class="alert alert-danger" th:if="${param.error}"><i
                                class="bi bi-exclamation-circle me-2"></i>Invalid username or password.</div>
                        <div class="alert alert-success" th:if="${param.logout}"><i
                                class="bi bi-check-circle me-2"></i>You have been logged out.</div>
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3"><label class="form-label fw-semibold"
                                    for="username">Username</label><input class="form-control" id="username"
                                    name="username" required autofocus></div>
                            <div class="mb-3"><label class="form-label fw-semibold"
                                    for="password">Password</label><input class="form-control" id="password"
                                    name="password" type="password" required></div><button
                                class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right me-1"></i>Sign
                                In</button>
                        </form>
                    </div>
                </div>
                <div class="text-center text-muted small mt-3">Phase 2 · Identity + School</div>
            </div>
        </div>
    </div>
</body>

</html>
