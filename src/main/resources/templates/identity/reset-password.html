<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">

<head>
	<title>Reset Password</title>
</head>

<body>
	<section layout:fragment="content">
		<div class="page-header">
			<div class="text-uppercase small text-primary fw-bold">Account security</div>
			<h1 class="page-title h3 mb-1">Reset Password</h1>
			<p class="text-muted mb-0">Enter your current password before choosing a new one.</p>
		</div>
		<div th:if="${message}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span
				th:text="${message}"></span></div>
		<div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i><span
				th:text="${error}"></span></div>
		<div class="card">
			<div class="card-body p-4">
				<form th:action="@{/reset-password}" th:object="${request}" method="post" class="row g-3">
					<div class="col-12"><label class="form-label">Current password</label><input type="password"
							class="form-control" th:field="*{currentPassword}" autocomplete="current-password">
						<div class="text-danger small" th:errors="*{currentPassword}"></div>
					</div>
					<div class="col-md-6"><label class="form-label">New password</label><input type="password"
							class="form-control" th:field="*{newPassword}" minlength="8" autocomplete="new-password">
						<div class="text-danger small" th:errors="*{newPassword}"></div>
					</div>
					<div class="col-md-6"><label class="form-label">Confirm new password</label><input type="password"
							class="form-control" th:field="*{confirmPassword}" minlength="8"
							autocomplete="new-password">
						<div class="text-danger small" th:errors="*{confirmPassword}"></div>
					</div>
					<div class="col-12 mt-2"><button class="btn btn-primary"><i
								class="bi bi-shield-lock me-1"></i>Update Password</button></div>
				</form>
			</div>
		</div>
	</section>
</body>

</html>
