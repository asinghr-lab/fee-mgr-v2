<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base}"><head><title>Payments</title></head><body><section layout:fragment="content"><div class="page-header"><div class="text-uppercase small text-primary fw-bold">Collection</div><h1 class="page-title h3">Payments</h1></div><div th:if="${message}" class="alert alert-success" th:text="${message}"></div><div class="card mb-3"><div class="card-body"><form class="row g-2" method="get"><div class="col-md-8"><input class="form-control" name="term" th:value="${term}" placeholder="Search admission number or mobile number"></div><div class="col-auto"><button class="btn btn-primary">Search</button></div></form></div></div><div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Receipt</th><th>Student</th><th>Admission No.</th><th>Amount</th><th>Paid At</th></tr></thead><tbody><tr th:each="p:${payments.content}"><td th:text="${p.receiptNumber}"></td><td th:text="${p.invoice.studentEnrollment.student.fullName}"></td><td th:text="${p.invoice.studentEnrollment.student.admissionNumber}"></td><td th:text="${p.amount}"></td><td th:text="${p.paidAt}"></td></tr><tr th:if="${payments.empty}"><td colspan="5" class="text-center text-muted py-4">No payments found.</td></tr></tbody></table></div><div class="card-body" th:if="${payments.totalPages > 1}"><a class="btn btn-sm btn-outline-secondary me-2" th:if="${payments.hasPrevious()}" th:href="@{/collection/payments(term=${term},page=${payments.number-1})}">Previous</a><span>Page <b th:text="${payments.number+1}"></b> of <b th:text="${payments.totalPages}"></b></span><a class="btn btn-sm btn-outline-secondary ms-2" th:if="${payments.hasNext()}" th:href="@{/collection/payments(term=${term},page=${payments.number+1})}">Next</a></div></div></section></body></html>
