<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base}"><body><section layout:fragment="content"><div class="d-flex justify-content-between"><div><h1 class="page-title h3">Student Collection Report</h1><p>Student: <b th:text="${report.studentName}"></b> <span class="text-muted" th:text="${report.admissionNumber}"></span></p></div><a class="btn btn-outline-secondary" th:href="@{/reporting/yearly}">Back</a></div><div class="table-responsive card"><table class="table table-sm"><thead><tr><th>Metric</th><th th:each="m:${report.months}" th:text="${m.month}"></th><th>Yearly Total</th></tr></thead><tbody><tr><th>Invoiced</th><td th:each="m:${report.months}" th:text="${m.invoiced}"></td><td th:text="${report.yearlyInvoiced}"></td></tr><tr><th>Discount Requested</th><td th:each="m:${report.months}" th:text="${m.requestedDiscount}"></td><td th:text="${report.yearlyRequestedDiscount}"></td></tr><tr><th>Discount Approved</th><td th:each="m:${report.months}" th:text="${m.approvedDiscount}"></td><td th:text="${report.yearlyApprovedDiscount}"></td></tr><tr><th>Collected</th><td th:each="m:${report.months}" th:text="${m.collected}"></td><td th:text="${report.yearlyCollected}"></td></tr><tr><th>Outstanding</th><td th:each="m:${report.months}" th:text="${m.outstanding}"></td><td th:text="${report.yearlyOutstanding}"></td></tr></tbody></table></div></section></body></html>
