<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">

<body>
	<section layout:fragment="content">
		<h1 class="page-title h3" th:text="${late?'Late Payments':'On-time Payers'}"></h1>
		<div class="table-responsive card">
			<table class="table table-hover mb-0">
				<thead>
					<tr>
						<th>Student</th>
						<th>Admission No.</th>
						<th>Grade</th>
						<th>Late Payments</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="r:${rows.content}">
						<td><a th:href="@{/reporting/students/{id}(id=${r.enrollmentId})}"
								th:text="${r.studentName}"></a></td>
						<td th:text="${r.admissionNumber}"></td>
						<td th:text="${r.gradeName}"></td>
						<td th:text="${r.latePayments}"></td>
					</tr>
				</tbody>
			</table>
		</div>
	</section>
</body>

</html>
