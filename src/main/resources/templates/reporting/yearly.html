<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base}"><body><section layout:fragment="content"><div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="page-title h3">Yearly Collection Report</h1><p class="text-muted mb-0">Academic Year: <b th:text="${year.name}"></b></p></div></div><div class="table-responsive card"><table class="table table-hover mb-0"><thead><tr><th>Grade</th><th>OneTime Due</th><th>Yearly Due</th><th>Half-yearly</th><th>Quarterly</th><th>Monthly</th><th>Total Due</th><th>Collected</th><th>Outstanding</th></tr></thead><tbody><tr th:each="r:${rows.content}"><td><a th:href="@{/reporting/yearly/grade/{id}(id=${r.gradeId})}" th:text="${r.gradeName}"></a></td><td th:text="${r.oneTime}"></td><td th:text="${r.yearly}"></td><td th:text="${r.halfYearly}"></td><td th:text="${r.quarterly}"></td><td th:text="${r.monthly}"></td><td th:text="${r.totalDue}"></td><td th:text="${r.collected}"></td><td th:text="${r.outstanding}"></td></tr></tbody></table></div><div class="mt-3" th:if="${rows.totalPages>1}"><a class="btn btn-sm btn-outline-secondary" th:if="${rows.number>0}" th:href="@{/reporting/yearly(page=${rows.number-1})}">Previous</a><span class="mx-2">Page <b th:text="${rows.number+1}"></b> / <b th:text="${rows.totalPages}"></b></span><a class="btn btn-sm btn-outline-secondary" th:if="${!rows.last}" th:href="@{/reporting/yearly(page=${rows.number+1})}">Next</a></div></section></body></html>
