<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">
<body>
	<section layout:fragment="content">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<div>
				<h1 class="page-title h3 mb-1">Q1-Student-Report</h1>
				<p class="text-muted mb-0">Student: <b th:text="${report.studentName}"></b><br>Grade: <b th:text="${report.gradeName}"></b> · Academic Year: <b th:text="${report.academicYear}"></b></p>
			</div>
			<a class="btn btn-sm btn-outline-secondary" th:href="@{/reporting/q1/grade/{id}(id=${report.gradeId})}"><i class="bi bi-arrow-left me-1"></i>Back</a>
		</div>
		<div class="table-responsive card">
		<table class="table mb-0 text-nowrap">
		<thead><tr><th>April Collected</th><th>April Outstanding</th><th>May Collected</th><th>May Outstanding</th><th>June Collected</th><th>June Outstanding</th><th>Q1 Total Outstanding</th></tr></thead>
		<tbody><tr>
		<td th:text="${report.amounts.aprilCollected}"></td><td th:text="${report.amounts.aprilOutstanding}"></td><td th:text="${report.amounts.mayCollected}"></td><td th:text="${report.amounts.mayOutstanding}"></td><td th:text="${report.amounts.juneCollected}"></td><td th:text="${report.amounts.juneOutstanding}"></td><td th:text="${report.amounts.q1TotalOutstanding}"></td>
		</tr></tbody>
		</table>
		</div>
	</section>
</body>
</html>
