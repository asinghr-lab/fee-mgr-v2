<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base}"><head><title>Invoices</title></head><body><section layout:fragment="content"><div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3"><div><div class="text-uppercase small text-primary fw-bold">Billing</div><h1 class="page-title h3">Issued Invoices</h1><p class="text-muted mb-0">Search by admission number or mobile number.</p></div><a class="btn btn-primary" th:href="@{/billing/generate}"><i class="bi bi-plus-lg me-1"></i>Generate</a></div><div th:if="${activeYear}" class="alert alert-light border"><i class="bi bi-calendar3 me-2 text-primary"></i>System academic year: <strong th:text="${activeYear.name}">2026-2027</strong></div><div class="card"><div class="card-body"><form class="row g-2" method="get"><div class="col-md-8"><input class="form-control" name="q" th:value="${query}" placeholder="Admission number or mobile number"></div><div class="col-auto"><button class="btn btn-primary"><i class="bi bi-search me-1"></i>Search</button></div><div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/billing/invoices}">Clear</a></div></form></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Invoice</th><th>Student</th><th>Grade</th><th>Billing Month</th><th>Generated</th><th class="text-end">Net Amount</th><th></th></tr></thead><tbody><tr th:each="i:${page.content}"><td class="fw-semibold" th:text="${i.invoiceNumber}"></td><td><div th:text="${i.studentEnrollment.student.fullName}"></div><small class="text-muted" th:text="${i.studentEnrollment.student.admissionNumber}"></small></td><td th:text="${i.studentEnrollment.grade.name}"></td><td th:text="${i.billingMonth}"></td><td th:text="${#temporals.format(i.generationDate,'dd MMM yyyy HH:mm')}"></td><td class="text-end fw-semibold" th:text="${i.netAmount}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{'/billing/invoices/' + ${i.id}}">View</a></td></tr><tr th:if="${page.empty}"><td colspan="7" class="text-center text-muted py-5">No issued invoices found.</td></tr></tbody></table></div><div class="card-footer d-flex justify-content-between align-items-center" th:if="${page.totalPages > 1}"><span class="small text-muted" th:text="${'Page ' + (page.number+1) + ' of ' + page.totalPages}"></span><div class="btn-group"><a class="btn btn-sm btn-outline-secondary" th:classappend="${page.first?' disabled':''}" th:href="@{/billing/invoices(page=${page.number-1},q=${query})}">Previous</a><a class="btn btn-sm btn-outline-secondary" th:classappend="${page.last?' disabled':''}" th:href="@{/billing/invoices(page=${page.number+1},q=${query})}">Next</a></div></div></div></section></body></html>
