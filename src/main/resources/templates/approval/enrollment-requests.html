<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">

<head>
	<title th:text="${historical ? 'Historical Enrollment Requests' : 'Active Enrollment Requests'}">Enrollment Requests
	</title>
</head>

<body>
	<section layout:fragment="content">
		<div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3">
			<div>
				<div class="text-uppercase small text-primary fw-bold">Approval center</div>
				<h1 class="page-title h3"
					th:text="${historical ? 'Historical Enrollment Requests' : 'Active Enrollment Requests'}"></h1>
				<p class="text-muted mb-0"
					th:text="${historical ? 'Approved and cancelled requests.' : 'Pending requests awaiting administrator approval.'}">
				</p>
			</div>
			<div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/}"><i
						class="bi bi-grid me-1"></i>Dashboard</a><a class="btn btn-outline-primary"
					th:if="${!historical}" th:href="@{/school/enrollments/history}"><i
						class="bi bi-clock-history me-1"></i>History</a><a class="btn btn-outline-primary"
					th:if="${historical}" th:href="@{/school/enrollments/requests}"><i
						class="bi bi-hourglass-split me-1"></i>Active</a></div>
		</div>
		<div th:if="${message}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span
				th:text="${message}"></span></div>
		<div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i><span
				th:text="${error}"></span></div>
		<div class="card">
			<div class="table-responsive">
				<table class="table table-hover mb-0">
					<thead>
						<tr>
							<th>Student</th>
							<th>Admission #</th>
							<th>Academic Year</th>
							<th>Grade</th>
							<th>Status</th>
							<th>Requested By</th>
							<th>Request Date</th>
							<th>Approved By</th>
							<th>Approval Date</th>
							<th th:if="${!historical}">Action</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="r : ${requests}">
							<td class="fw-semibold" th:text="${r.student.fullName}"></td>
							<td th:text="${r.student.admissionNumber}"></td>
							<td th:text="${r.academicYear.name}"></td>
							<td th:text="${r.grade.name}"></td>
							<td><span class="badge rounded-pill"
									th:classappend="${r.status.name() == 'REQUESTED' ? 'text-bg-warning' : (r.status.name() == 'APPROVED' ? 'text-bg-success' : 'text-bg-secondary')}"
									th:text="${r.status}"></span></td>
							<td th:text="${r.requestedBy.username}"></td>
							<td th:text="${r.requestDate}"></td>
							<td th:text="${r.approvedBy == null ? '—' : r.approvedBy.username}"></td>
							<td th:text="${r.approvalDate == null ? '—' : r.approvalDate}"></td>
							<td th:if="${!historical}">
								<div class="d-flex gap-1">
									<form method="post" th:action="@{'/school/enrollments/' + ${r.id} + '/approve'}">
										<button class="btn btn-sm btn-success"
											onclick="return confirm('Approve this enrollment request?')"><i
												class="bi bi-check2 me-1"></i>Approve</button>
									</form>
									<form method="post" th:action="@{'/school/enrollments/' + ${r.id} + '/cancel'}">
										<button class="btn btn-sm btn-outline-danger"
											onclick="return confirm('Cancel this enrollment request?')"><i
												class="bi bi-x-lg me-1"></i>Cancel</button>
									</form>
								</div>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(requests)}">
							<td th:colspan="${historical ? 9 : 10}" class="text-center py-5 text-muted"><i
									class="bi bi-inbox fs-2 d-block mb-2"></i><span
									th:text="${historical ? 'No historical requests found.' : 'No active enrollment requests.'}"></span>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</section>
</body>

</html>
