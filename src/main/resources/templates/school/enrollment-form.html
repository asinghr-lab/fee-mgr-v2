<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/base}">

<head>
    <title>Request Enrollment</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-xl-8">
                <div class="page-header">
                    <div class="text-uppercase small text-primary fw-bold">Enrollment workflow</div>
                    <h1 class="page-title h3">Request Enrollment</h1>
                    <p class="text-muted mb-0">An administrator must approve the request before it becomes active.</p>
                </div>
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3">
                            <div class="stat-icon"><i class="bi bi-person-vcard"></i></div>
                            <div>
                                <div class="small text-muted">Student</div>
                                <div class="fw-bold fs-5" th:text="${student.fullName}"></div>
                                <div class="small text-muted" th:text="${student.admissionNumber}"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body p-4">
                        <form th:action="@{/school/enrollments}" th:object="${request}" method="post"><input
                                type="hidden" th:field="*{studentId}">
                            <div class="mb-3"><label class="form-label fw-semibold">Academic Year</label><select
                                    class="form-select" th:field="*{academicYearId}" required>
                                    <option value="">Select academic year</option>
                                    <option th:each="y : ${years}" th:if="${y.active}" th:value="${y.id}"
                                        th:text="${y.name}"></option>
                                </select>
                                <div class="text-danger small" th:errors="*{academicYearId}"></div>
                            </div>
                            <div class="mb-3"><label class="form-label fw-semibold">Grade</label><select
                                    class="form-select" th:field="*{gradeId}" required>
                                    <option value="">Select grade</option>
                                    <option th:each="g : ${grades}" th:value="${g.id}" th:text="${g.name}"></option>
                                </select>
                                <div class="text-danger small" th:errors="*{gradeId}"></div>
                            </div>
                            <div class="alert alert-warning"><i class="bi bi-hourglass-split me-2"></i>Status will be
                                <strong>REQUESTED</strong>.</div>
                            <div class="d-flex gap-2"><button class="btn btn-primary"><i
                                        class="bi bi-send me-1"></i>Submit Request</button><a
                                    class="btn btn-outline-secondary" th:href="@{/school/students}">Cancel</a></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
