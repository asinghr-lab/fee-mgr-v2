<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base}">

<head>
	<title th:text="${pageTitle}">Grade</title>
</head>

<body>
	<section layout:fragment="content">
		<div class="row justify-content-center">
			<div class="col-lg-7">
				<div class="page-header">
					<div class="text-uppercase small text-primary fw-bold">School module</div>
					<h1 class="page-title h3" th:text="${pageTitle}"></h1>
					<p class="text-muted mb-0">Maintain the school's grade list and display order.</p>
				</div>
				<div class="card">
					<div class="card-body p-4">
						<form th:action="${gradeId != null ? '/school/grades/' + gradeId : '/school/grades'}"
							th:object="${request}" method="post">
							<div class="mb-3"><label class="form-label fw-semibold">Grade Name</label><input
									class="form-control" th:field="*{name}" placeholder="Grade 1" required>
								<div class="text-danger small" th:errors="*{name}"></div>
							</div>
							<div class="mb-3"><label class="form-label fw-semibold">Display Order</label><input
									type="number" min="1" class="form-control" th:field="*{displayOrder}" required>
								<div class="text-danger small" th:errors="*{displayOrder}"></div>
							</div>
							<div class="d-flex gap-2 mt-4"><button class="btn btn-primary"><i
										class="bi bi-check2 me-1"></i>Save Grade</button><a
									class="btn btn-outline-secondary" th:href="@{/school}">Cancel</a></div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
