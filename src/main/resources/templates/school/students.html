<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/base}">

<head>
    <title>Students</title>
</head>

<body>
    <section layout:fragment="content">
        <div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <div class="text-uppercase small text-primary fw-bold">School module</div>
                <h1 class="page-title h3">Students</h1>
                <p class="text-muted mb-0">Admission date is set automatically when a student is added.</p>
            </div>
            <div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/school}"><i
                        class="bi bi-building me-1"></i>School</a><a class="btn btn-primary"
                    th:href="@{/school/students/new}"><i class="bi bi-person-plus me-1"></i>Add Student</a></div>
        </div>
        <div th:if="${message}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i><span
                th:text="${message}"></span></div>
        <div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i><span
                th:text="${error}"></span></div>
        <div class="card">
            <div class="card-header p-3">
                <h2 class="h6 mb-0"><i class="bi bi-people-fill me-2 text-primary"></i>Student Directory</h2>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Admission #</th>
                            <th>Student</th>
                            <th>Admission Date</th>
                            <th>Date of Birth</th>
                            <th>Phone</th>
                            <th>Enrollment</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${students}">
                            <td class="fw-semibold" th:text="${s.admissionNumber}"></td>
                            <td>
                                <div class="fw-semibold" th:text="${s.fullName}"></div>
                                <div class="small text-muted" th:text="${s.email ?: ''}"></div>
                            </td>
                            <td th:text="${s.admissionDate}"></td>
                            <td th:text="${s.dateOfBirth ?: '—'}"></td>
                            <td th:text="${s.phoneNumber ?: '—'}"></td>
                            <td><a class="btn btn-sm btn-outline-primary"
                                    th:href="@{'/school/students/' + ${s.id} + '/enroll'}"><i
                                        class="bi bi-send me-1"></i>Request</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="6" class="text-center py-5 text-muted"><i
                                    class="bi bi-people fs-2 d-block mb-2"></i>No students have been added yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</body>

</html>
